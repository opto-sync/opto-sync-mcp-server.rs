# Keep the full ORES trace/routine marker contract, but execute it as an
# ordinary job. The old cross-repository workflow_call failed before job setup
# on this repository, leaving a misleading zero-job failure.
# The same upstream checker is already exercised by ores-static-ids.yml.
name: ORES static observability IDs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ores-static-observability-ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the consumer tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate static ORES trace/routine IDs
        uses: ores-otel/ores-otel-monorepo/.github/actions/ores-trace-contract@6453e2660c1422b573eede4179838e890e89358c
