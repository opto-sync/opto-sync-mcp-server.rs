# Static ORES trace-marker compatibility contract.
# Admission: ^ores-(trace|routine)-[A-Za-z0-9_-]{12,64}$
# Canonical generator: 21-character nanoid suffix.
# The upstream checker is the matching implementation from ores.otel.log,
# with test-only helpers gated to tests so -D warnings builds succeed.
name: ORES trace marker contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ores-trace-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Self-test and verify static ORES trace/routine markers
        uses: ores-otel/ores-otel-monorepo/.github/actions/ores-trace-contract@6453e2660c1422b573eede4179838e890e89358c
