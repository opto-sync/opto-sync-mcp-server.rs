name: Security lock refresh proof

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustls-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install repository MSRV toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Refresh only the vulnerable rustls package
        run: rustup run 1.95.0 cargo update -p rustls --precise 0.23.45

      - name: Verify the refreshed lock builds without resolver drift
        run: rustup run 1.95.0 cargo check --locked --all-targets --all-features

      - name: Audit the refreshed lock
        run: |
          rustup run 1.95.0 cargo install cargo-audit --version 0.22.2 --locked
          rustup run 1.95.0 cargo audit --deny warnings

      - name: Upload generated lockfile for reviewed adoption
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustls-0.23.45-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
