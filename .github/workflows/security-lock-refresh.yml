name: Security lock refresh proof

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustls-refresh:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install repository MSRV toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Refresh only the vulnerable rustls package
        run: rustup run 1.95.0 cargo update -p rustls --precise 0.23.45

      - name: Verify the refreshed lock builds without resolver drift
        run: rustup run 1.95.0 cargo check --locked --all-targets --all-features

      - name: Audit the refreshed lock
        run: |
          rustup run 1.95.0 cargo install cargo-audit --version 0.22.2 --locked
          rustup run 1.95.0 cargo audit --deny warnings

      - name: Adopt the audited lockfile on this same-repository PR branch
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already contains the audited rustls refresh; no mutation required.'
            exit 0
          fi

          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_BRANCH" --jq '.object.sha')"
          test "$current_head" = "$EXPECTED_HEAD" || {
            echo 'PR head changed during security proof; refusing to write stale evidence.' >&2
            exit 1
          }

          lock_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=$EXPECTED_HEAD" --jq '.sha')"
          encoded_lock="$(base64 -w0 Cargo.lock)"
          committed_sha="$(
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/Cargo.lock" \
              -f message='security: refresh rustls lock to 0.23.45' \
              -f content="$encoded_lock" \
              -f sha="$lock_blob" \
              -f branch="$HEAD_BRANCH" \
              --jq '.commit.sha'
          )"
          test -n "$committed_sha"
          echo "Audited lockfile committed to $HEAD_BRANCH at $committed_sha"

      - name: Upload generated lockfile receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustls-0.23.45-lock-${{ github.event.pull_request.head.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
